# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repo]
name = "spec-cee"
org = "structural-explainability"
class = "spec"
kind = "specification"
status = "active"
since = "2025"
summary = "Defines the CEE specification."

# === Layer Position ===

[layer]
space = "structural-explainability"
role = "specification"

# === Dependency Declarations ===

[depends]
required = [
  { repo = "spec-se", kind = "semantic", version = "v1" },
  { repo = "spec-ae", kind = "semantic", version = "v1" },
  { repo = "spec-ep", kind = "semantic", version = "v1" },
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = ["README.md", "SPEC.md", "IDENTIFIERS.md", "CONFORMANCE.md"]

# === Scope ===

[scope]
includes = [
  "context tags",
  "explanation records referencing substrate identifiers",
  "attestations of responsibility",
  "provenance for CEE-level artifacts",
  "multiplicity under disagreement",
]
excludes = [
  "modification of substrate identity or history",
  "truth criteria or validation",
  "causal inference",
  "normative enforcement",
]

[citation]
cff = "CITATION.cff"
preferred = "spec"

[traceability]
identifier_map = "structural-explainability/spec-cee/IDENTIFIERS.md"
