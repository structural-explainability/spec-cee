# ============================================================
# SE_MANIFEST.toml (Repository Intent, Scope, and Role)
# ============================================================

schema = "se-manifest-1"
schema_url = "https://github.com/structural-explainability/spec-se/blob/main/manifests/se-manifest-1.md"

[meta]
# Non-normative contextual information
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
framework_note = "Provides definitions and conventions for SE_MANIFEST semantics."
description = "Declarative claim of repository intent, scope, and role."
purpose = "To make explicit the boundaries, responsibilities, and expectations of this repository relative to others."

[repo]
name = "spec-cee"
org  = "structural-explainability"
kind = "spec"
status = "normative"
since = "2025"
summary = "Defines the interpretive interface for context, explanation, attestation, and provenance over substrate histories."

[layer]
space = "SE"
role  = "interpretive-interface"

[depends]
required = [
  "structural-explainability/spec-se@v1",
  "structural-explainability/spec-ae@v1",
  "structural-explainability/spec-ep@v1",
]
optional = []

[provides]
artifacts = ["README.md", "SPEC.md", "IDENTIFIERS.md", "CONFORMANCE.md"]

[scope]
includes = [
  "context tags",
  "explanation records referencing substrate identifiers",
  "attestations of responsibility",
  "provenance for CEE-level artifacts",
  "multiplicity under disagreement",
]
excludes = [
  "modification of substrate identity or history",
  "truth criteria or validation",
  "causal inference",
  "normative enforcement",
]

[citation]
cff = "CITATION.cff"
preferred = "spec"
bib_hint = "case2025-spec-cee"

[traceability]
identifier_map = "structural-explainability/spec-cee/IDENTIFIERS.md"
